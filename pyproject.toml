[project]
name = "beyond-balance"
version = "0.1.0"
description = "A simple Hello World CLI tool"
authors = [
    {name = "Moritz Mock", email = "moritz.mock@student.unibz.it"},
    {name = "Thomas Borsani", email = "thomas.borsani@student.unibz.it"},
    {name = "Giuseppe Di Fatta", email = "giuseppe.difatta@unibz.it"},
    {name = "Barbara Russo", email = "barbara.russo@unibz.it"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"

dependencies = [
    "accelerate==1.8.1",
    "agate==1.13.0",
    "agate-dbf==0.2.3",
    "agate-excel==0.4.1",
    "agate-sql==0.7.2",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.12.13",
    "aiosignal==1.3.2",
    "async-timeout==5.0.1",
    "attrs==25.3.0",
    "babel==2.17.0",
    "certifi==2025.6.15",
    "charset-normalizer==3.4.2",
    "csvkit==2.1.0",
    "datasets==3.6.0",
    "dbfread==2.0.7",
    "dill==0.3.8",
    "et_xmlfile==2.0.0",
    "evaluate==0.4.4",
    "filelock==3.18.0",
    "frozenlist==1.7.0",
    "fsspec==2025.3.0",
    "greenlet==3.2.3",
    "huggingface-hub==0.31.4",
    "idna==3.10",
    "isodate==0.7.2",
    "Jinja2==3.1.6",
    "joblib==1.5.1",
    "leather==0.4.0",
    "MarkupSafe==3.0.2",
    "mpmath==1.3.0",
    "multidict==6.5.1",
    "multiprocess==0.70.16",
    "networkx==3.4.2",
    "numpy==2.2.5",
    "olefile==0.47",
    "openpyxl==3.1.5",
    "packaging==25.0",
    "pandas==2.2.3",
    "parsedatetime==2.6",
    "pillow==11.2.1",
    "propcache==0.3.2",
    "psutil==7.0.0",
    "pyarrow==20.0.0",
    "python-dateutil==2.9.0.post0",
    "python-slugify==8.0.4",
    "pytimeparse==1.1.8",
    "pytz==2025.2",
    "PyYAML==6.0.2",
    "regex==2024.11.6",
    "requests==2.32.4",
    "safetensors==0.5.3",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
    "sentence-transformers==4.1.0",
    "setfit==1.1.2",
    "six==1.17.0",
    "SQLAlchemy==2.0.41",
    "sympy==1.14.0",
    "text-unidecode==1.3",
    "threadpoolctl==3.6.0",
    "tokenizers==0.21.2",
    "torch==2.7.1",
    "tqdm==4.67.1",
    "transformers==4.51.3",
    "typing_extensions==4.14.0",
    "tzdata==2025.2",
    "urllib3==2.5.0",
    "xlrd==2.0.2",
    "xxhash==3.5.0",
    "yarl==1.20.1"
]

[project.scripts]
beyond_balance = "beyond_balance.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["beyond_balance*"]

