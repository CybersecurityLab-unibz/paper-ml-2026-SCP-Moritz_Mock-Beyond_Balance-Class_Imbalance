[project]
name = "NLBSE_JEX"
version = "0.1.0"
description = "A simple Hello World CLI tool"
authors = [
    {name = "Moritz Mock", email = "moritz.mock@student.unibz.it"},
    {name = "Thomas Borsani", email = "thomas.borsani@student.unibz.it"},
    {name = "Giuseppe Di Fatta", email = "giuseppe.difatta@unibz.it"},
    {name = "Barbara Russo", email = "barbara.russo@unibz.it"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"

dependencies = [
    "numpy==2.2.5",
    "pandas==2.2.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "six==1.17.0",
    "tzdata==2025.2",
    "pyyaml==6.0.2",
    "setfit==1.1.2",
    "huggingface-hub==0.31.4",
    "transformers==4.51.3"
]

[project.scripts]
nlbse_jex = "nlbse_jex.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nlbse_jex"]
